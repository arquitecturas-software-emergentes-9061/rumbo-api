spring:
  application:
    name: rumbo-api
  config:
    import: optional:file:.env[.properties]
  autoconfigure:
    # Accounts live in IAM; Spring's generated in-memory user is never used.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rumbo}
    username: ${DB_USERNAME:rumbo}
    password: ${DB_PASSWORD:rumbo}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # Fail fast: if Redis is down, IAM falls back to PostgreSQL instead of holding the request.
      timeout: 500ms
      connect-timeout: 500ms
      ssl:
        enabled: ${REDIS_SSL:false}
  mvc:
    problemdetails:
      enabled: true
rumbo:
  planning:
    editing:
      enabled: ${RUMBO_PLANNING_EDITING_ENABLED:false}
    publication:
      enabled: ${RUMBO_PLANNING_PUBLICATION_ENABLED:false}
  navigation:
    directory:
      enabled: ${RUMBO_NAVIGATION_DIRECTORY_ENABLED:false}
  security:
    jwt:
      secret: ${JWT_SECRET:}
      issuer: rumbo-api
    session:
      access-token-lifetime: 15m
      refresh-token-lifetime: 7d
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  swagger-ui:
    path: /swagger-ui.html
