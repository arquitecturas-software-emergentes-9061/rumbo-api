spring:
  application:
    name: rumbo-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rumbo}
    username: ${DB_USERNAME:rumbo}
    password: ${DB_PASSWORD:rumbo}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
  mvc:
    problemdetails:
      enabled: true
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  swagger-ui:
    path: /swagger-ui.html
