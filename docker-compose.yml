# Local infrastructure for development: `docker compose up -d`
# Credentials are development defaults and can be overridden from `.env` (see `.env.example`).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-rumbo}
      POSTGRES_USER: ${DB_USERNAME:-rumbo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rumbo}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - rumbo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-rumbo} -d ${DB_NAME:-rumbo}"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  # Optional (not started by a plain `docker compose up`): reads PDF, PNG and JPEG plans for the interpretation
  # endpoint. Start it with `docker compose --profile mapper up -d structural-mapper` and enable it in the API with
  # STRUCTURAL_MAPPER_ENABLED=true (see structural-mapper/README.md).
  structural-mapper:
    profiles: ["mapper"]
    build: ./structural-mapper
    ports:
      - "127.0.0.1:8010:8010"
volumes:
  rumbo-postgres:
