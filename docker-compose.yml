# Local infrastructure for development: `docker compose up -d`
# Credentials are development defaults and can be overridden from `.env` (see `.env.example`).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-rumbo}
      POSTGRES_USER: ${DB_USERNAME:-rumbo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rumbo}
    ports:
      - "5432:5432"
    volumes:
      - rumbo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-rumbo} -d ${DB_NAME:-rumbo}"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  rumbo-postgres:
