name: API CI
on:
  push:
    branches: [main, develop, 'feat/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [develop, main]
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Tests and package
        run: mvn -B --no-transfer-progress clean verify
