spring.application.name=rumbo-api
server.port=${PORT:8080}
management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.path=/swagger-ui.html

#---
spring.config.activate.on-profile=!postgres
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

#---
spring.config.activate.on-profile=postgres
spring.datasource.url=${RUMBO_DB_URL}
spring.datasource.username=${RUMBO_DB_USER}
spring.datasource.password=${RUMBO_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
rumbo.planning.editing.enabled=${RUMBO_PLANNING_EDITING_ENABLED:false}
rumbo.planning.publication.enabled=${RUMBO_PLANNING_PUBLICATION_ENABLED:false}

#---
spring.config.activate.on-profile=postgres & local
server.address=127.0.0.1
rumbo.planning.editing.enabled=true
rumbo.planning.publication.enabled=true
rumbo.navigation.directory.enabled=true
rumbo.navigation.routes.enabled=true
