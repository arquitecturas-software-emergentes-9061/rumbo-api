spring.application.name=rumbo-api
spring.config.import=optional:file:.env[.properties]
spring.profiles.default=postgres,local
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
server.port=${PORT:8080}
server.address=${RUMBO_SERVER_ADDRESS:127.0.0.1}
management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.path=/swagger-ui.html
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
spring.servlet.multipart.resolve-lazily=true
spring.datasource.url=${RUMBO_DB_URL:${DB_URL}}
spring.datasource.username=${RUMBO_DB_USER:${DB_USERNAME}}
spring.datasource.password=${RUMBO_DB_PASSWORD:${DB_PASSWORD}}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.flyway.locations=classpath:db/migration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.mvc.problemdetails.enabled=false
rumbo.planning.editing.enabled=true
rumbo.planning.publication.enabled=true
rumbo.planning.structural-mapper.enabled=${STRUCTURAL_MAPPER_ENABLED:false}
rumbo.planning.structural-mapper.url=${STRUCTURAL_MAPPER_URL:http://localhost:8010}
rumbo.planning.structural-mapper.use-ml=${STRUCTURAL_MAPPER_USE_ML:true}
rumbo.planning.structural-mapper.connect-timeout-ms=2000
rumbo.planning.structural-mapper.read-timeout-ms=30000
rumbo.navigation.directory.enabled=true
rumbo.navigation.routes.enabled=true
rumbo.analytics.metrics-cache-ttl=5m
rumbo.security.jwt.secret=${JWT_SECRET:}
rumbo.security.jwt.issuer=rumbo-api
rumbo.security.session.access-token-lifetime=15m
rumbo.security.session.refresh-token-lifetime=7d
rumbo.security.password-recovery.token-lifetime=30m
rumbo.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
