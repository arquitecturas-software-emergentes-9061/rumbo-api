spring.application.name=rumbo-api
spring.profiles.default=postgres,local
server.port=${PORT:8080}
server.address=127.0.0.1
management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.path=/swagger-ui.html
spring.datasource.url=${RUMBO_DB_URL}
spring.datasource.username=${RUMBO_DB_USER}
spring.datasource.password=${RUMBO_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
rumbo.planning.editing.enabled=true
rumbo.planning.publication.enabled=true
rumbo.navigation.directory.enabled=true
rumbo.navigation.routes.enabled=true
