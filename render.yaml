# Demo deployment from the deploy branch. No real credentials are stored in Git.
services:
  - type: web
    name: rumbo-api-demo
    runtime: docker
    plan: free
    branch: deploy
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres,local
      - key: RUMBO_SERVER_ADDRESS
        value: 0.0.0.0
      - key: RUMBO_DB_HOST
        fromDatabase:
          name: rumbo-demo-db
          property: host
      - key: RUMBO_DB_PORT
        fromDatabase:
          name: rumbo-demo-db
          property: port
      - key: RUMBO_DB_NAME
        fromDatabase:
          name: rumbo-demo-db
          property: database
      - key: RUMBO_DB_USER
        fromDatabase:
          name: rumbo-demo-db
          property: user
      - key: RUMBO_DB_PASSWORD
        fromDatabase:
          name: rumbo-demo-db
          property: password
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: rumbo-demo-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: rumbo-demo-redis
          property: port
      - key: JWT_SECRET
        generateValue: true
      # The structural mapper (plan interpretation with the CubiCasa5k model) is inside this same image and only starts
      # when STRUCTURAL_MAPPER_EMBEDDED=true. With the model loaded it needs about 1 GB, so set it in the dashboard
      # only after moving this service to an instance with at least 2 GB. sync: false keeps the dashboard value.
      - key: STRUCTURAL_MAPPER_EMBEDDED
        sync: false
      # Address of an external structural mapper, for example the one a presenter runs on a laptop and publishes with
      # scripts/live-mapper.sh. It changes on every run, so it is set in the dashboard (sync: false keeps that value).
      - key: STRUCTURAL_MAPPER_URL
        sync: false
      - key: STRUCTURAL_MAPPER_USE_ML
        value: "true"
      # A tunnel to a laptop adds latency, and the first analysis after a start can take a while.
      - key: RUMBO_PLANNING_STRUCTURAL_MAPPER_CONNECT_TIMEOUT_MS
        value: "15000"
      - key: RUMBO_PLANNING_STRUCTURAL_MAPPER_READ_TIMEOUT_MS
        value: "120000"
      # Origins allowed to call the API from a browser: no trailing slash, no path, comma separated.
      - key: CORS_ALLOWED_ORIGINS
        value: https://rumbo-web-rho.vercel.app,https://arquitecturas-software-emergentes-9061.github.io,http://localhost:4200
  - type: keyvalue
    name: rumbo-demo-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction
databases:
  - name: rumbo-demo-db
    plan: free
    postgresMajorVersion: "17"
    ipAllowList: []
